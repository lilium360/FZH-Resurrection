[package]
name = "fzh-launcher"
version = "0.2.6"
description = "FZH:Resurrection launcher"
license = "GPL-2.0-or-later"
edition = "2021"
publish = false

[lib]
name = "fzh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
junction = "1"
socket2 = "0.6"
aes = "0.8"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
